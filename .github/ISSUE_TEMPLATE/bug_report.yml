name: Bug report
description: Report a reproducible FBS CLI defect without sharing credentials.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Never include a CFBD key, `.env` file, authorization header, or unredacted secret.

  - type: input
    id: version
    attributes:
      label: FBS CLI version
      description: Run `fbs --version`.
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Run `node --version`.
      placeholder: v22.12.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - npm global install
        - npx
        - repository development checkout
        - Other
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Redacted command
      description: Include flags and placeholder values, never the API key.
      render: shell
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include redacted YAML and the exit code when useful.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Credential safety
      options:
        - label: I removed API keys, authorization headers, `.env` contents, and other secrets.
          required: true
